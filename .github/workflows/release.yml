name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Docker image → GitHub Container Registry ──────────────────────
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── macOS desktop app → GitHub Release ────────────────────────────
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build backend binary (PyInstaller)
        run: |
          pyinstaller --onefile --name keepr-backend \
            --add-data "src/web:src/web" \
            --hidden-import pypdf \
            --hidden-import aiosqlite \
            backend_main.py

      - name: Copy binary for Tauri
        run: |
          mkdir -p src-tauri/binaries
          cp dist/keepr-backend src-tauri/binaries/keepr-backend-aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri .app and .dmg
        run: |
          cd src-tauri
          cargo tauri build

      - name: Upload .dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched: true
