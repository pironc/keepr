[project]
name = "keepr"
version = "0.1.0"
description = "Privacy-first, local-first document RAG assistant"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "numpy>=2.1",
    "psutil>=6.0",
    "pypdf>=5.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
llama = [
    "llama-cpp-python>=0.3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "httpx>=0.27",
    "types-psutil>=6.0",
    "mypy>=1.13",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --disable-socket --allow-unix-socket"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "llama_cpp.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# B008: FastAPI's Depends()/File()/Form() are meant to be used as argument
# defaults — that's the framework's own idiom, not a bug.
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
