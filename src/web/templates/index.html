<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>keepr</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="preload" href="/static/fonts/BricolageGrotesque-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/Geist-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/JetBrainsMono-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/static/fonts/JetBrainsMono-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <script>
    // Stamp persisted collapse + zoom state on <html> before first paint so
    // neither the grid nor the zoomed root font-size ever flashes the
    // default state for a single frame.  CSS mirrors the collapse classes
    // onto the same grid-template-columns that [data-sidebar] /
    // [data-sources-panel] use at runtime — see app.css for the paired
    // :root rules.  ZOOM_LEVELS is duplicated from app.js on purpose: this
    // script runs before app.js loads and this app has no module system to
    // share a constant across the two files — keep both in sync if either
    // is edited (see the matching comment in app.js).
    (function(){
      var h = document.documentElement;
      if (localStorage.getItem("sidebar-collapsed") === "1") h.classList.add("sb-coll");
      if (localStorage.getItem("sources-collapsed") === "1") h.classList.add("sp-coll");

      var ZOOM_LEVELS = [0.7, 0.8, 0.9, 1.0, 1.1, 1.25, 1.5, 1.75, 2.0];
      var zi = parseInt(localStorage.getItem("zoom-index"), 10);
      if (Number.isInteger(zi) && zi >= 0 && zi < ZOOM_LEVELS.length) {
        h.style.setProperty("--zoom", String(ZOOM_LEVELS[zi]));
      }
    })();
  </script>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand" id="brand"><span class="brand-initial">k</span><span class="brand-rest">eepr</span></span>
        <button type="button" id="sidebar-toggle" class="icon-btn sidebar-toggle" title="Toggle sidebar">
          <img class="toggle-icon-collapse" src="/static/icons/panel-collapse.svg" alt="Collapse sidebar" />
          <img class="toggle-icon-expand" src="/static/icons/panel-expand.svg" alt="Expand sidebar" />
        </button>
      </div>
      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg class="new-chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span class="new-chat-label">New chat</span>
      </button>
      <button id="search-chats-btn" class="new-chat-btn search-chats-btn" type="button">
        <svg class="new-chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <span class="new-chat-label">Search</span>
      </button>
      <div class="sidebar-section-label" id="recents-label">Recents</div>
      <div class="sidebar-conversations">
        <div id="conversation-list" class="conversation-list"></div>
      </div>
    </aside>
    <script>
      // Apply sidebar collapsed class before paint (mirrors the html.sb-coll
      // grid rule above — without this the internal labels/buttons flash
      // expanded while the column is already narrow).
      if (document.documentElement.classList.contains("sb-coll")) {
        document.getElementById("sidebar").classList.add("collapsed");
      }
    </script>

    <main class="chat-panel">
      <div id="messages" class="messages"></div>

      <div id="staged-tray" class="staged-tray"></div>

      <form id="composer" class="composer">
        <div class="composer-side" id="composer-side-left"
             aria-label="Composer left controls">
          <button id="settings-btn" class="settings-btn icon-btn" type="button" title="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
        <div id="drop-zone" class="drop-zone">
          <textarea
            id="prompt-input"
            rows="1"
            placeholder="Ask a question, or drop a file to add it to this conversation"
            disabled
          ></textarea>
          <input
            id="file-input"
            type="file"
            multiple
            hidden
            accept=".pdf,.txt,.md,.rst,.log,.json,.csv,.tsv,.yaml,.yml,.xml,.ini,.cfg,.conf,.toml,.py,.js,.jsx,.ts,.tsx,.html,.htm,.css,.scss,.sh,.bash,.zsh,.rb,.go,.rs,.java,.c,.cpp,.h,.hpp,.cs,.php,.sql,.kt,.swift,.pl,.lua,.mp3,.wav,.m4a,.mp4,.mov,.webm"
          />
          <button type="button" id="attach-btn" class="icon-btn" title="Attach files">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
            </svg>
          </button>
          <button type="submit" id="send-btn" class="icon-btn send-btn" title="Send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z" />
              <path d="M22 2 11 13" />
            </svg>
          </button>
        </div>
        <!-- Right-hand composer side-slot, mirrored with the left so the
             input box stays dead-centred; a future control lands here. -->
        <div class="composer-side" id="composer-side-right"
             aria-label="Composer right controls"></div>
      </form>
    </main>

    <aside class="sources-panel" id="sources-panel">
      <div class="sources-header">
        <button type="button" id="sources-toggle" class="icon-btn sources-toggle" title="Toggle sources">
          <img class="toggle-icon-doc" src="/static/icons/document.svg" alt="Sources" />
          <img class="toggle-icon-collapse" src="/static/icons/panel-expand.svg" alt="Collapse sources" />
          <img class="toggle-icon-expand" src="/static/icons/panel-collapse.svg" alt="Expand sources" />
        </button>
        <span class="sources-heading" id="sources-heading">Sources</span>
      </div>
      <div id="sources-list" class="sources-list"></div>
    </aside>
    <script>
      if (document.documentElement.classList.contains("sp-coll")) {
        document.getElementById("sources-panel").classList.add("collapsed");
      }
    </script>
  </div>

  <div id="delete-confirm" class="modal-backdrop" aria-hidden="true">
    <div class="confirm-card">
      <div class="confirm-message" id="confirm-message"></div>
      <div class="confirm-actions">
        <button type="button" class="confirm-btn confirm-btn-cancel" id="confirm-cancel">Cancel</button>
        <button type="button" class="confirm-btn confirm-btn-delete" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <div id="model-swap-confirm" class="modal-backdrop" aria-hidden="true">
    <div class="confirm-card">
      <div class="confirm-message" id="model-swap-message"></div>
      <div class="confirm-actions">
        <button type="button" class="confirm-btn confirm-btn-restart" id="model-swap-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="citation-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-container">
      <button type="button" class="icon-btn modal-close" id="modal-close" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18" /><path d="m6 6 12 12" />
        </svg>
      </button>
      <div class="modal-body" id="modal-body">
        <!-- PDF iframe or text snippet injected here -->
      </div>
    </div>
  </div>

  <div id="search-overlay" class="search-overlay" aria-hidden="true">
    <div class="search-popup">
      <div class="search-popup-header">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="search" id="search-popup-input" placeholder="Search chats..." autocomplete="off" />
        <button type="button" id="search-popup-close" class="icon-btn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" /><path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div id="search-popup-results" class="search-popup-results"></div>
    </div>
  </div>

  <div id="rename-overlay" class="rename-overlay" aria-hidden="true">
    <div class="rename-popup">
      <p class="rename-heading">Rename this chat</p>
      <input type="text" id="rename-input" class="rename-input" autocomplete="off" />
      <div class="rename-actions">
        <button type="button" id="rename-cancel" class="rename-btn rename-btn-cancel">Cancel</button>
        <button type="button" id="rename-save" class="rename-btn rename-btn-save">Rename</button>
      </div>
    </div>
  </div>

  <div id="global-drop-overlay" class="global-drop-overlay" aria-hidden="true">
    <div class="global-drop-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="global-drop-icon">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      <p>Drop files to add them to this conversation</p>
    </div>
  </div>

  <div id="settings-overlay" class="settings-overlay" aria-hidden="true">
    <div class="settings-popup">
      <div class="settings-popup-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="settings-header-icon">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="settings-heading">Models</span>
        <button type="button" id="settings-close" class="icon-btn" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18" /><path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <div class="settings-body" id="settings-body">
        <!-- Populated by JS: driver info + model status rows -->
      </div>
    </div>
  </div>

  <!-- Download notification stack: one toast node per model download, stacked
       bottom-up (newest at the bottom).  Each node is a clone of the template
       below; JS mounts/unmounts them so a queued second download gets its own
       pill rather than reusing one. -->
  <div class="toast-stack" id="toast-stack" role="status" aria-live="polite"></div>
  <div id="zoom-toast" class="zoom-toast" role="status" aria-live="polite" hidden></div>
  <template id="download-toast-template">
    <!-- Persistent download-into-tray glyph: it is the whole collapsed toast, and
         the leading icon of the expanded one (which adds a text label + %).
         During an active download the toast becomes cancellable: the download
         glyph morphs into an X on hover and clicking aborts the transfer. Both
         SVGs live in one sizing wrapper so the swap never causes a reflow. -->
    <div class="download-toast" role="status">
      <div class="download-toast-icon" aria-hidden="true">
        <svg class="download-toast-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <svg class="download-toast-cancel-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
